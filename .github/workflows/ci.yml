name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (Biome)
        # Cambiar a `npm run check` (lint + formato) cuando se aplique el formateo general.
        run: npm run lint
      - name: Pruebas (node --test) con cobertura
        # Las pruebas simulan la BD; el CI nunca se conecta a Azure.
        run: npm run test:coverage
